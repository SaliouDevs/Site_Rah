<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1b33">
    <title>eAutoecole - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/tokens.css">
    <link rel="stylesheet" href="./assets/css/admin.css">
    <link rel="stylesheet" href="./assets/css/admin-exams.css">
    <link rel="stylesheet" href="./assets/css/admin-platform.css">
    <link rel="stylesheet" href="./assets/css/admin-product-suite.css">
    <link rel="stylesheet" href="./assets/css/admin-experience-polish.css">
</head>
<body class="admin-page">
    <div class="admin-shell">
        <header class="admin-topbar">
            <div class="admin-topbar-inner">
                <div class="admin-brand">
                    <span><i class="fas fa-car-side"></i></span>
                    <div><strong data-brand-app>eAutoecole</strong><small data-brand-school>Auto-école · Pilotage</small></div>
                </div>
                <div class="admin-actions">
                    <span class="admin-live-pill"><i class="fas fa-circle"></i> Administration</span>
                    <button class="admin-secondary" type="button" data-admin-logout>Déconnexion</button>
                </div>
            </div>
        </header>
        <main class="admin-main">
            <nav class="admin-nav" aria-label="Navigation admin">
                <button class="active" type="button" data-admin-view="dashboard"><i class="fas fa-chart-pie"></i><span>Tableau de bord</span></button>
                <button type="button" data-admin-view="users"><i class="fas fa-users"></i><span>Utilisateurs</span></button>
                <button type="button" data-admin-view="instructors"><i class="fas fa-chalkboard-user"></i><span>Moniteurs</span></button>
                <button type="button" data-admin-view="exams"><i class="fas fa-clipboard-check"></i><span>Examens</span></button>
                <button type="button" data-admin-view="lessons"><i class="fas fa-book-open"></i><span>Leçons</span></button>
                <button type="button" data-admin-view="panels"><i class="fas fa-traffic-light"></i><span>Panneaux</span></button>
                <button type="button" data-admin-view="media"><i class="fas fa-photo-film"></i><span>Médias</span></button>
                <button type="button" data-admin-view="branding"><i class="fas fa-wand-magic-sparkles"></i><span>Identité</span></button>
            </nav>
            <section id="admin-view"></section>
        </main>
    </div>
    <div id="modal-root" class="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" integrity="sha384-K0oxqktRvaThvYgGL4G+OK2Ih6VS6Uyu7j3+7WJgp/uWM0Yv6Xi4YEiw0BB+mPfi" crossorigin="anonymous"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/exam-access.js"></script>
    <script type="module" src="./assets/js/brand-runtime.js"></script>
    <script type="module" src="./assets/js/admin-page.js"></script>
    <script type="module" src="./assets/js/admin/admin-enhancements.js"></script>
    <script type="module" src="./assets/js/admin/admin-product-suite.js"></script>
    <script type="module" src="./assets/js/admin/admin-dashboard-insights.js"></script>
</body>
</html>
