<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eAutoecole - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/tokens.css">
    <link rel="stylesheet" href="./assets/css/admin.css">
    <link rel="stylesheet" href="./assets/css/admin-exams.css">
    <link rel="stylesheet" href="./assets/css/admin-platform.css">
</head>
<body class="admin-page">
    <div class="admin-shell">
        <header class="admin-topbar">
            <div class="admin-topbar-inner">
                <div class="admin-brand">
                    <span><i class="fas fa-car-side"></i></span>
                    <div><strong>eAutoecole</strong><small>Admin</small></div>
                </div>
                <div class="admin-actions"><button class="admin-secondary" type="button" data-admin-logout>Déconnexion</button></div>
            </div>
        </header>
        <main class="admin-main">
            <nav class="admin-nav" aria-label="Navigation admin">
                <button class="active" type="button" data-admin-view="dashboard">Tableau de bord</button>
                <button type="button" data-admin-view="users">Utilisateurs</button>
                <button type="button" data-admin-view="exams">Examens</button>
                <button type="button" data-admin-view="lessons">Leçons</button>
                <button type="button" data-admin-view="panels">Panneaux</button>
                <button type="button" data-admin-view="media">Médias</button>
            </nav>
            <section id="admin-view"></section>
        </main>
    </div>
    <div id="modal-root" class="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js" integrity="sha384-K0oxqktRvaThvYgGL4G+OK2Ih6VS6Uyu7j3+7WJgp/uWM0Yv6Xi4YEiw0BB+mPfi" crossorigin="anonymous"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/supabase.js"></script>
    <script src="./assets/js/exam-access.js"></script>
    <script type="module" src="./assets/js/admin-page.js"></script>
    <script type="module" src="./assets/js/admin/admin-enhancements.js"></script>
</body>
</html>
