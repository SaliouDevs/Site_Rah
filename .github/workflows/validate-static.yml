name: Validate static app

on:
  push:
    branches:
      - v3.3.1-admin-cms-ux
      - v3.4-instructor-payments
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Audit exam CMS seed
        run: node scripts/audit-cms-seed.cjs

      - name: Verify CMS fallback safety
        run: node scripts/test-exam-cms-absent.mjs

      - name: Verify product contracts
        run: node scripts/test-product-contracts.cjs

      - name: Check whitespace
        run: git diff --check HEAD^
